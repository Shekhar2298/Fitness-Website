   text-align: center;

        content: "*";

<body class="page page-form page-join">
    <a class="form-back-home" href="./index.html">&larr; Back to Home</a>
    <h1 class="th">Registration Form</h1>
    <main class="table1">
        <h2>Fill info properly-</h2>
        <form class="row g-3" method="post" name="form1" action="#" onsubmit="return valid()">
            <div class="col-md-6 required">
                <label for="NameInput" id="namestar" class="form-label">Name:</label>
                <input type="text" class="form-control" id="NameInput" name="Name" placeholder="Enter your name" required>
            </div>
            <div class="col-md-6 required">
                <label for="inputEmail4" class="form-label" id="namestar">Email ID:</label>
                <input type="text" class="form-control" id="inputEmail4" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" placeholder="Enter Email-ID" name="Emailid" required>
            </div>
            <div class="col-md-6 required">
                <label for="inputmobile" class="form-label" id="namestar">Mobile Number:</label>
                <input type="text" pattern="[789][0-9]{9}" title="Enter valid number" class="form-control" id="inputmobile" placeholder="Enter Mobile Number" name="contactmobi" required>
            </div>
            <div class="col-md-6 required">
                <label for="country" class="form-label" id="namestar">Country:</label>
                <select onchange="print_state('states',this.selectedIndex);" name="country" id="country" class="form-select" required>
                    <option value=" ">--Select country--</option>
                </select>
            </div>
            <div class="col-md-6 required">
                <label for="states" class="form-label" id="namestar">State:</label>
                <select onchange="print_cities('cities',this.selectedIndex);" name="state" id="states" class="form-select" required>
                    <option value=" ">--Select state--</option>
                </select>
            </div>
            <div class="col-md-6 required">
                <label for="city" class="form-label" id="namestar">City:</label>
                <input id="city" name="city" class="form-control" placeholder="Enter your city" required>
            </div>
            <div class="col-12 required">
                <label for="inputAddress" class="form-label" id="namestar">Address:</label>
                <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main Street" name="address" required>
            </div>
            <div class="col-md-6 required">
                <label for="inputZip" class="form-label" id="namestar">Zip Code:</label>
                <input type="text" class="form-control" id="inputZip" placeholder="Enter Zip Code" name="zipy" inputmode="numeric" pattern="[0-9-]{5,10}" required>
            </div>
            <div class="col-md-6 required">
                <label for="inputpsw" class="form-label" id="namestar">Password:</label>
                <input type="password" class="form-control" id="inputpsw" placeholder="Enter password" name="psw" pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=\S+$).{8,}$" required>
            </div>
            <div class="col-md-6 required">
                <label for="confirmpsw" class="form-label" id="namestar">Confirm Password:</label>
                <input type="password" class="form-control" id="confirmpsw" placeholder="Enter password" name="cfpsw" pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=\S+$).{8,}$" required>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="invalidCheck3" aria-describedby="invalidCheck3Feedback" required>
                    <label class="form-check-label" for="invalidCheck3">Agree to terms and conditions</label>
                </div>
            </div>
            <div class="col-12">
                <button type="submit" value="send" class="btn btn-primary" name="submit" id="datasend">Sign Up</button>
            </div>
        </form>
    </main>

<script src="./Script.js/countrylist.js"></script>
<script type="text/javascript" language="javascript">
    print_country("country");
</script>
<script type="text/javascript" language="javascript">
    print_cuntry("states");
</script>

</body>
