<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Feedback | Fit Factory</title>
    <link rel="stylesheet" href="./Resources/CSS/theme.css">
</head>
<body class="page page-form page-suggestion">
    <a class="form-back-home" href="./index.html">&larr; Back to Home</a>
    <main class="suggestion-card">
        <p class="eyebrow"><span></span> HELP US MAKE IT BETTER</p>
        <h1>Share your<br><em>thoughts.</em></h1>
        <p class="suggestion-intro">Tell us what would make your Fit Factory experience more useful, welcoming, or motivating.</p>
        <form action="#" method="post">
            <div class="suggestion-grid"><div><label for="fname">First name</label><input type="text" id="fname" name="firstname" placeholder="Your name" required></div><div><label for="lname">Last name</label><input type="text" id="lname" name="lastname" placeholder="Your last name"></div></div>
            <label for="country">Country</label><input type="text" id="country" name="country" placeholder="Where are you writing from?">
            <label for="subject">Your message</label><textarea id="subject" name="subject" placeholder="What’s on your mind?" required></textarea>
            <button type="submit">Send feedback <span aria-hidden="true">→</span></button>
        </form>
    </main>
</body>
</html>
